    <div id="vortan-analytics-consent" role="region" aria-label="Preferências de cookies" hidden>
      <div class="vortan-consent-content">
        <div class="vortan-consent-text">
          <strong>Privacidade na Vortan</strong>
          <p>Usamos cookies de análise para entender as visitas e melhorar nosso site. O Google Analytics só será ativado se você aceitar.</p>
        </div>
        <div class="vortan-consent-actions">
          <button type="button" id="vortan-consent-reject">Recusar</button>
          <button type="button" id="vortan-consent-accept">Aceitar</button>
        </div>
      </div>
    </div>
    <button type="button" id="vortan-cookie-settings" aria-label="Alterar a escolha de cookies de análise" hidden>Cookies</button>
    <script>
      (function () {
        var MEASUREMENT_ID = "G-1N3XT4D4HQ";
        var STORAGE_KEY = "vortan_analytics_consent_v1";
        var banner = document.getElementById("vortan-analytics-consent");
        var settings = document.getElementById("vortan-cookie-settings");
        var acceptButton = document.getElementById("vortan-consent-accept");
        var rejectButton = document.getElementById("vortan-consent-reject");
        var existingChoice = null;

        try { existingChoice = localStorage.getItem(STORAGE_KEY); } catch (e) { /* armazenamento indisponível */ }

        function saveChoice(choice) {
          try { localStorage.setItem(STORAGE_KEY, choice); } catch (e) { /* nova escolha no próximo acesso */ }
        }

        function activateAnalytics() {
          if (document.querySelector('script[data-vortan-analytics="true"]')) return;
          window["ga-disable-" + MEASUREMENT_ID] = false;
          gtag("consent", "update", {
            analytics_storage: "granted",
            ad_storage: "denied",
            ad_user_data: "denied",
            ad_personalization: "denied"
          });
          gtag("js", new Date());
          // Sem query/hash para não enviar tokens de login ou parâmetros pessoais.
          gtag("config", MEASUREMENT_ID, {
            page_location: window.location.origin + window.location.pathname,
            allow_google_signals: false,
            allow_ad_personalization_signals: false
          });
          var tag = document.createElement("script");
          tag.async = true;
          tag.src = "https://www.googletagmanager.com/gtag/js?id=" + MEASUREMENT_ID;
          tag.setAttribute("data-vortan-analytics", "true");
          document.head.appendChild(tag);
        }

        function removeAnalyticsCookies() {
          document.cookie.split(";").forEach(function (entry) {
            var name = entry.split("=")[0].trim();
            if (!/^(_ga($|_)|_gid$|_gat($|_))/.test(name)) return;
            var base = name + "=; Max-Age=0; Path=/; SameSite=Lax";
            document.cookie = base;
            if (location.hostname.endsWith("vortanoficina.com.br")) {
              document.cookie = base + "; Domain=.vortanoficina.com.br";
            }
          });
        }

        function choose(choice) {
          saveChoice(choice);
          banner.hidden = true;
          settings.hidden = false;
          if (choice === "accepted") {
            activateAnalytics();
          } else {
            // Ao revogar o aceite, bloqueia novas coletas e encerra a tag já carregada.
            window["ga-disable-" + MEASUREMENT_ID] = true;
            gtag("consent", "update", {
              analytics_storage: "denied",
              ad_storage: "denied",
              ad_user_data: "denied",
              ad_personalization: "denied"
            });
            removeAnalyticsCookies();
            if (document.querySelector('script[data-vortan-analytics="true"]')) {
              window.location.reload();
            }
          }
        }

        acceptButton.addEventListener("click", function () { choose("accepted"); });
        rejectButton.addEventListener("click", function () { choose("rejected"); });
        settings.addEventListener("click", function () {
          banner.hidden = false;
          settings.hidden = true;
          acceptButton.focus();
        });

        if (existingChoice === "accepted") {
          banner.hidden = true;
          settings.hidden = false;
          activateAnalytics();
        } else if (existingChoice === "rejected") {
          banner.hidden = true;
          settings.hidden = false;
          window["ga-disable-" + MEASUREMENT_ID] = true;
        } else {
          banner.hidden = false;
          settings.hidden = true;
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
